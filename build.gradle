plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.3.1'
}

group = 'me.erotoro'
version = '1.5'
def spigotApiVersion = '1.21.1-R0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        url = uri('https://maven.enginehub.org/repo/')
        metadataSources {
            mavenPom()
            artifact()
        }
    }
    maven {
        url = uri('https://jitpack.io')
        metadataSources {
            mavenPom()
            artifact()
        }
    }
    maven {
        url = uri('https://repo.papermc.io/repository/maven-public/')
    }
    maven {
        url = uri('https://hub.spigotmc.org/nexus/content/repositories/snapshots/')
    }
    maven {
        url = uri('https://maven.playpro.com')
    }
    maven {
        url = uri('https://libraries.minecraft.net')
        metadataSources {
            mavenPom()
            artifact()
        }
    }
}

dependencies {
    implementation 'org.bstats:bstats-bukkit:3.2.1'
    compileOnly "org.spigotmc:spigot-api:${spigotApiVersion}"
    compileOnly "com.sk89q.worldguard:worldguard-bukkit:7.0.16"
    compileOnly "com.github.GriefPrevention:GriefPrevention:16.18.7"
    compileOnly "net.coreprotect:coreprotect:23.1"
    testImplementation "org.spigotmc:spigot-api:${spigotApiVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.1'
    testImplementation 'org.mockito:mockito-core:5.18.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.18.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.1'
}

configurations.configureEach {
    resolutionStrategy.activateDependencyLocking()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

tasks.test {
    useJUnitPlatform()
}

tasks.jar {
    archiveClassifier = 'thin'
}

tasks.shadowJar {
    archiveClassifier = ''
    configurations = [project.configurations.runtimeClasspath]

    dependencies {
        exclude { dependency -> dependency.moduleGroup != 'org.bstats' }
    }

    relocate('org.bstats', "${project.group}.treechopper.libs.bstats")
}

tasks.assemble {
    dependsOn tasks.shadowJar
}

processResources {
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}
