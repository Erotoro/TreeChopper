plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.3.1'
    id 'xyz.wagyourtail.jvmdowngrader' version '1.3.6'
    id 'com.modrinth.minotaur' version '2.+'
}

group = 'me.erotoro'
version = '1.7.0'
def spigotApiVersion = '1.21.1-R0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        url = uri('https://maven.enginehub.org/repo/')
        metadataSources {
            mavenPom()
            artifact()
        }
    }
    maven {
        url = uri('https://jitpack.io')
        metadataSources {
            mavenPom()
            artifact()
        }
    }
    maven {
        url = uri('https://repo.papermc.io/repository/maven-public/')
    }
    maven {
        url = uri('https://hub.spigotmc.org/nexus/content/repositories/snapshots/')
    }
    maven {
        url = uri('https://maven.playpro.com')
    }
    maven {
        url = uri('https://repo.extendedclip.com/content/repositories/placeholderapi/')
    }
    maven {
        url = uri('https://libraries.minecraft.net')
        metadataSources {
            mavenPom()
            artifact()
        }
    }
}

dependencies {
    implementation 'org.bstats:bstats-bukkit:3.2.1'
    compileOnly "org.spigotmc:spigot-api:${spigotApiVersion}"
    compileOnly "com.sk89q.worldguard:worldguard-bukkit:7.0.16"
    compileOnly "com.github.GriefPrevention:GriefPrevention:16.18.7"
    compileOnly "net.coreprotect:coreprotect:23.1"
    compileOnly "me.clip:placeholderapi:2.11.6"
    testImplementation "org.spigotmc:spigot-api:${spigotApiVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.1'
    testImplementation 'org.mockito:mockito-core:5.18.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.18.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.1'
}

configurations.configureEach {
    resolutionStrategy.activateDependencyLocking()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

tasks.test {
    useJUnitPlatform()
}

tasks.jar {
    archiveClassifier = 'thin'
}

tasks.shadowJar {
    // Intermediate fat jar (Java 21 bytecode). JvmDowngrader consumes this and emits the
    // distributable, so we keep the clean, unclassified name for the downgraded artifact below.
    archiveClassifier = 'java21'
    configurations = [project.configurations.runtimeClasspath]

    dependencies {
        exclude { dependency -> dependency.moduleGroup != 'org.bstats' }
    }

    relocate('org.bstats', "${project.group}.treechopper.libs.bstats")
}

// Downgrade the shaded Java 21 bytecode (records, sealed types, switch patterns, JDK 9+ APIs) to
// Java 8 so a single jar loads on the whole MC range (1.16 → latest). Bukkit API gaps are handled
// separately in the me.erotoro.treechopper.compat package.
jvmdg {
    downgradeTo = JavaVersion.VERSION_1_8
    // Inline only the downgrade-runtime methods actually used, directly into our jar.
    shadeInlining = true
}

// The shaded, downgraded jar is the real distributable: give it the clean name (TreeChopper-x.y.z.jar).
tasks.named('shadeDowngradedApi') {
    archiveClassifier = ''
}

tasks.assemble {
    dependsOn tasks.named('shadeDowngradedApi')
}

processResources {
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

// Publish the final (shaded + Java 8 downgraded) jar to Modrinth.
// Usage: set the MODRINTH_TOKEN env var, then run `./gradlew modrinth`.
// Optional overrides: MODRINTH_VERSION_TYPE (release|beta|alpha), MODRINTH_CHANGELOG.
modrinth {
    token = providers.environmentVariable('MODRINTH_TOKEN').orElse('')
    projectId = 'treechopper-ultra'
    versionNumber = project.version
    versionName = "TreeChopper ${project.version}"
    versionType = providers.environmentVariable('MODRINTH_VERSION_TYPE').orElse('release')
    uploadFile = tasks.named('shadeDowngradedApi')
    gameVersions = [
            '1.16.5', '1.17.1', '1.18.2', '1.19.4',
            '1.20.4', '1.20.6', '1.21.4', '1.21.11',
            '26.1', '26.1.2'
    ]
    loaders = ['paper', 'folia', 'spigot', 'bukkit']
    changelog = providers.environmentVariable('MODRINTH_CHANGELOG').orElse('See the GitHub release notes.')
    // We list loaders/versions explicitly; don't let Minotaur guess from dependencies.
    detectLoaders = false
}

// Make sure the artifact is built and downgraded before uploading.
tasks.named('modrinth') {
    dependsOn tasks.named('shadeDowngradedApi')
}
