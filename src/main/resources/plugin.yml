name: TreeChopper
version: ${version}
main: me.erotoro.treechopper.TreeChopper
api-version: '1.21'
description: Plugin for instant tree chopping
author: Erotoro
folia-supported: true
softdepend:
  - WorldGuard
  - GriefPrevention
  - CoreProtect
commands:
  treechopper:
    description: TreeChopper management commands
    usage: /treechopper <reload|toggle>
permissions:
  treechopper.reload:
    description: Allows reloading TreeChopper data without restarting the server
    default: op
  treechopper.toggle:
    description: Allows enabling or disabling TreeChopper per player
    default: true
